services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cosmetic_bot
      POSTGRES_USER: bot_user
      POSTGRES_PASSWORD: bot_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_user -d cosmetic_bot"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build: .
    command: uv run alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bot_user:bot_password@postgres:5432/cosmetic_bot
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: .
    command: uv run python -m scripts.scripts
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bot_user:bot_password@postgres:5432/cosmetic_bot
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bot_user:bot_password@postgres:5432/cosmetic_bot
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
